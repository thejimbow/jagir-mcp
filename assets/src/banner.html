<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Vazirmatn:wght@400;500;700;800&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: #FFFFFF; }
  body { position: relative; font-family: Inter, sans-serif; color: #0B3D2E; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(#DCEDE6 1.6px, transparent 1.6px); background-size: 28px 28px; mask-image: linear-gradient(90deg, transparent 0%, #000 55%, #000 100%); -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 55%, #000 100%); }
  .blob { position: absolute; width: 620px; height: 620px; right: -90px; top: 10px; border-radius: 50%; background: #EAF7F1; }
  .tile { position: absolute; width: 300px; height: 300px; right: 140px; top: 170px; border-radius: 68px; background: #FFFFFF; border: 2px solid #DCEDE6; box-shadow: 0 30px 60px -30px rgba(14,138,99,.35); display: flex; align-items: center; justify-content: center; }
  .left { position: absolute; left: 88px; top: 84px; width: 700px; }
  .pill { display: inline-flex; gap: 10px; align-items: center; padding: 8px 16px; border-radius: 999px; background: #EAF7F1; color: #0E8A63; font-weight: 500; font-size: 20px; }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: #1DB584; display: inline-block; }
  h1 { margin-top: 26px; display: flex; align-items: baseline; gap: 26px; }
  h1 .en { font-size: 128px; font-weight: 800; letter-spacing: -5px; line-height: 1; }
  h1 .fa { font-family: Vazirmatn, sans-serif; font-size: 64px; font-weight: 700; color: #0E8A63; }
  .tag { margin-top: 26px; font-size: 30px; line-height: 1.35; color: #3B5A50; font-weight: 400; }
  .tag b { color: #0B3D2E; font-weight: 500; }
  .fa-tag { margin-top: 14px; font-family: Vazirmatn, sans-serif; direction: rtl; text-align: left; font-size: 25px; color: #5B7A70; white-space: nowrap; }
  .chips { margin-top: 34px; display: flex; gap: 12px; }
  .chip { padding: 10px 20px; border-radius: 14px; border: 2px solid #DCEDE6; font-size: 22px; font-weight: 500; color: #0B3D2E; background: #FFFFFF; }
</style></head>
<body>
  <div class="dots"></div>
  <div class="blob"></div>
  <div class="tile">
    <svg width="210" height="260" viewBox="36 28 108 134"><path d="M90 36 L136 76 L136 104 Q136 116 127 124 L90 154 L53 124 Q44 116 44 104 L44 76 Z" fill="none" stroke="#0E8A63" stroke-width="8" stroke-linejoin="round"/><circle cx="90" cy="96" r="13" fill="none" stroke="#1DB584" stroke-width="8"/></svg>
  </div>
  <div class="left">
    <span class="pill"><i></i>MCP server for Claude</span>
    <h1><span class="en">Jagir</span><span class="fa">جاگیر</span></h1>
    <p class="tag">Search and compare vacation rentals across <b>Iran’s top platforms</b>, right from Claude.</p>
    <p class="fa-tag">جستجو و مقایسه اقامتگاه در جاباما، جاجیگا و اتاقک</p>
    <div class="chips"><span class="chip">Jabama</span><span class="chip">Jajiga</span><span class="chip">Otaghak</span></div>
  </div>
</body></html>
